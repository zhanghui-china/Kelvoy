[project]
name = "kelvoy-inference"
version = "0.1.0"
description = "Persistent local inference service (services/inference) — llm/image/video/upscale, called by apps/worker over HTTP"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.7",
    "pydantic-settings",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
