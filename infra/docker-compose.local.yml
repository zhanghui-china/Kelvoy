# Local dev only — not the production cloud topology (see README.md).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kelvoy
      POSTGRES_PASSWORD: kelvoy
      POSTGRES_DB: kelvoy
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kelvoy
      MINIO_ROOT_PASSWORD: kelvoy-local
    ports:
      - "9000:9000"
      - "9001:9001"
