[project]
name = "dgx-bridge"
version = "0.1.0"
description = "Standalone bridge service exposing DGX Spark GPU workloads over HTTP (protocol TBD)"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "waitress>=3.0",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
